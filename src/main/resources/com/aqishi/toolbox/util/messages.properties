tool.gclog.advice.none=未发现明显问题
tool.gclog.advice.evacuationFailure.title=疏散失败 / to-space exhausted：{0} 次
tool.gclog.advice.evacuationFailure.detail=G1 回收时找不到空闲 Region 存放存活对象，只能原地保留，之后常紧跟一次 Full GC。通常是堆相对存活对象太小：增大 -Xmx，或调高 -XX:G1ReservePercent（默认 10），并排查是否有大量对象过早晋升。
tool.gclog.advice.promotionFailed.title=晋升失败：{0} 次
tool.gclog.advice.promotionFailed.detail=年轻代回收时老年代放不下晋升对象（空间不足或碎片化），这次回收升级为整堆回收。增大老年代（加大 -Xmx，或减小 -Xmn / NewRatio）；CMS 下可降低 -XX:CMSInitiatingOccupancyFraction 让并发周期更早开始。
tool.gclog.advice.concurrentModeFailure.title=CMS 并发模式失败：{0} 次
tool.gclog.advice.concurrentModeFailure.detail=并发周期结束前老年代就被填满，JVM 退回单线程 Full GC，停顿很长。降低 -XX:CMSInitiatingOccupancyFraction（配合 -XX:+UseCMSInitiatingOccupancyOnly）、增大堆，或迁移到 G1。
tool.gclog.advice.allocationStall.title=ZGC 分配停顿 {0} 次（合计 {1} ms，最长 {2} ms）
tool.gclog.advice.allocationStall.detail=应用线程分配内存时 ZGC 还没回收出空间，线程被阻塞，效果等同于停顿。增大 -Xmx 为回收留出余量，或调高 -XX:ConcGCThreads；JDK 21 可考虑分代 ZGC（-XX:+ZGenerational）。
tool.gclog.advice.frequentFullGc.title=Full GC {0} 次（每小时 {1} 次）
tool.gclog.advice.frequentFullGc.detail=对 G1、CMS、ZGC、Shenandoah 而言，Full GC 说明并发回收没跟上；对 Parallel、Serial 而言，频繁 Full GC 说明老年代太小或存活对象在增长。查看原因页签中的触发原因，增大堆或老年代，并结合堆底线趋势排查泄漏。
tool.gclog.advice.degeneratedGc.title=Shenandoah 退化 GC：{0} 次
tool.gclog.advice.degeneratedGc.detail=并发周期中内存耗尽，Shenandoah 改为 STW 完成剩余工作。增大堆，或调整启发式（-XX:ShenandoahGCHeuristics、-XX:ShenandoahMinFreeThreshold）让周期更早开始。
tool.gclog.advice.explicitGc.title=显式调用 System.gc()：{0} 次
tool.gclog.advice.explicitGc.detail=代码或依赖库（RMI 分布式 GC、NIO 直接内存回收、监控脚本等）主动调用了 System.gc()。确认没有必要后加 -XX:+DisableExplicitGC；如果依赖它释放直接内存，改用 -XX:+ExplicitGCInvokesConcurrent，让它触发并发周期而不是 Full GC。
tool.gclog.advice.humongous.title=巨型对象分配触发 GC：{0} 次（Region 大小 {1}）
tool.gclog.advice.humongous.detail=超过半个 Region 的对象会直接分配在老年代的连续 Region 中，容易引发额外 GC 和碎片。调大 -XX:G1HeapRegionSize（1M 到 32M，2 的幂），或拆小大数组、大缓冲区（分批处理、复用缓冲）。
tool.gclog.advice.metaspace.title=元空间触发 GC：{0} 次
tool.gclog.advice.metaspace.detail=类元数据达到阈值触发了回收。启动期出现属正常；运行中反复出现说明类在被不断加载（动态代理、脚本引擎、热部署）。设置合适的 -XX:MetaspaceSize 避免启动期抖动，并排查类加载器泄漏。
tool.gclog.advice.pauseTarget.title=最长停顿 {0} ms 超过目标 {1} ms（超标 {2} 次，p99 {3} ms）
tool.gclog.advice.pauseTarget.detail=在停顿页签按时长排序查看最长的停顿及其类型。年轻代停顿过长可减小年轻代或设置 -XX:MaxGCPauseMillis；由 Full GC 造成的长停顿应先消除 Full GC；对延迟敏感的服务可考虑 ZGC 或 Shenandoah。
tool.gclog.advice.lowThroughput.title=吞吐量 {0}% 低于 {1}%
tool.gclog.advice.lowThroughput.detail=应用线程有相当比例的时间耗在 GC 停顿上。通常是堆太小导致 GC 过于频繁：增大 -Xmx，检查分配速率是否异常偏高（大量临时对象），并确认没有频繁的 Full GC。
tool.gclog.advice.heapFloor.title=回收后堆底线持续上涨：{0} MB/小时（增幅 {1}%，{2} 个点）
tool.gclog.advice.heapFloor.detail=每次回收后剩下的存活对象越来越多，可能存在内存泄漏（缓存无上限、集合只增不减、监听器未注销、ThreadLocal 未清理）。上涨一段时间后用 jmap -dump:live 或 jcmd GC.heap_dump 导出堆，对比支配树找出增长的对象。
tool.gclog.advice.timeToSafepoint.title=到达安全点最长 {0} ms（操作 {1}，超过 50 ms 的 {2} 次）
