tool.gclog.advice.none=No notable issues found
tool.gclog.advice.evacuationFailure.title=Evacuation failure / to-space exhausted: {0} times
tool.gclog.advice.evacuationFailure.detail=G1 ran out of free regions to copy live objects into, so they stayed in place and a Full GC often follows. The heap is usually too small for the live set: increase -Xmx or -XX:G1ReservePercent (default 10), and look for large amounts of prematurely promoted objects.
tool.gclog.advice.promotionFailed.title=Promotion failed: {0} times
tool.gclog.advice.promotionFailed.detail=The old generation could not take the objects promoted by a young collection (too little space or fragmentation), so the collection escalated to a full-heap one. Enlarge the old generation (larger -Xmx, or smaller -Xmn / NewRatio); with CMS, lower -XX:CMSInitiatingOccupancyFraction so concurrent cycles start earlier.
tool.gclog.advice.concurrentModeFailure.title=CMS concurrent mode failure: {0} times
tool.gclog.advice.concurrentModeFailure.detail=The old generation filled up before the concurrent cycle finished, forcing a long single-threaded Full GC. Lower -XX:CMSInitiatingOccupancyFraction (with -XX:+UseCMSInitiatingOccupancyOnly), enlarge the heap, or migrate to G1.
tool.gclog.advice.allocationStall.title=ZGC allocation stalls: {0} (total {1} ms, max {2} ms)
tool.gclog.advice.allocationStall.detail=Application threads had to wait because ZGC had not freed memory in time, which is effectively a pause. Give the collector headroom with a larger -Xmx or raise -XX:ConcGCThreads; on JDK 21 consider generational ZGC (-XX:+ZGenerational).
tool.gclog.advice.frequentFullGc.title=Full GC: {0} times ({1} per hour)
tool.gclog.advice.frequentFullGc.detail=For G1, CMS, ZGC and Shenandoah a Full GC means concurrent collection could not keep up; for Parallel and Serial, frequent Full GCs mean the old generation is too small or the live set is growing. Check the triggers in the Causes tab, enlarge the heap or old generation, and use the heap floor trend to look for leaks.
tool.gclog.advice.degeneratedGc.title=Shenandoah degenerated GC: {0} times
tool.gclog.advice.degeneratedGc.detail=Memory ran out during a concurrent cycle, so Shenandoah finished the remaining work stop-the-world. Enlarge the heap or tune the heuristics (-XX:ShenandoahGCHeuristics, -XX:ShenandoahMinFreeThreshold) so cycles start earlier.
tool.gclog.advice.explicitGc.title=Explicit System.gc() calls: {0}
tool.gclog.advice.explicitGc.detail=Code or libraries (RMI distributed GC, NIO direct buffer cleanup, monitoring scripts) called System.gc(). If it is not needed, add -XX:+DisableExplicitGC; if direct memory relies on it, use -XX:+ExplicitGCInvokesConcurrent so it starts a concurrent cycle instead of a Full GC.
tool.gclog.advice.humongous.title=Humongous allocations triggered GC: {0} times (region size {1})
tool.gclog.advice.humongous.detail=Objects larger than half a region are allocated directly in contiguous old regions, causing extra collections and fragmentation. Increase -XX:G1HeapRegionSize (1M to 32M, a power of two) or shrink large arrays and buffers (batch processing, buffer reuse).
tool.gclog.advice.metaspace.title=Metaspace-triggered GC: {0} times
tool.gclog.advice.metaspace.detail=Class metadata reached its threshold. This is normal during startup; repeated occurrences at runtime mean classes keep being loaded (dynamic proxies, script engines, hot redeploys). Set a suitable -XX:MetaspaceSize to avoid startup churn and check for class loader leaks.
tool.gclog.advice.pauseTarget.title=Max pause {0} ms exceeds the {1} ms target ({2} over target, p99 {3} ms)
tool.gclog.advice.pauseTarget.detail=Sort the Pauses tab by duration to see the longest pauses and their types. Long young pauses can be shortened with a smaller young generation or -XX:MaxGCPauseMillis; long pauses caused by Full GC are fixed by eliminating the Full GCs; latency-sensitive services may consider ZGC or Shenandoah.
tool.gclog.advice.lowThroughput.title=Throughput {0}% is below {1}%
tool.gclog.advice.lowThroughput.detail=Application threads lose a significant share of time to GC pauses. Usually the heap is too small and collections run too often: increase -Xmx, check whether the allocation rate is unusually high (many short-lived objects), and make sure there are no frequent Full GCs.
tool.gclog.advice.heapFloor.title=Post-GC heap floor keeps rising: {0} MB/hour (+{1}%, {2} points)
tool.gclog.advice.heapFloor.detail=The live set left after each collection keeps growing, which may indicate a memory leak (unbounded caches, ever-growing collections, unregistered listeners, uncleared ThreadLocals). After it has grown for a while, take a heap dump with jmap -dump:live or jcmd GC.heap_dump and compare dominator trees to find what grows.
tool.gclog.advice.timeToSafepoint.title=Time to safepoint up to {0} ms (operation {1}, {2} over 50 ms)
tool.gclog.advice.timeToSafepoint.detail=Some threads took a long time to reach the safepoint while all others waited. Common causes: long counted loops (the JIT removed safepoint polls), huge array copies, page faults or swapping, JNI calls. Consider -XX:+UseCountedLoopSafepoints (default since JDK 10) and check for swapping.
