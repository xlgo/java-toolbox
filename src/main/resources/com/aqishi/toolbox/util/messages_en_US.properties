tool.textescape.hint.javascript=JSON rules plus escaped single quotes. Unescape supports hex, braced code points, legacy octal and line continuations.
tool.textescape.hint.unicode=Converts only non-ASCII characters to Unicode escapes and leaves other text untouched, like native2ascii.
tool.textescape.hint.html=Escapes & < > " '. Unescape supports all HTML4 named entities and decimal/hex references; invalid code points become U+FFFD.
tool.textescape.hint.xml=Uses the 5 predefined entities. Control characters that XML 1.0 forbids even as references are replaced with U+FFFD and reported.
tool.textescape.hint.csv=A single RFC 4180 field: quoted when it contains the delimiter, quotes, line breaks or edge whitespace; inner quotes are doubled.
tool.textescape.hint.sql=ANSI by default (single quotes doubled). LIKE wildcards % and _ are not escaped. Prefer parameterized queries over string concatenation.
tool.textescape.hint.regex=Escapes metacharacters so the text matches literally in java.util.regex. Unescape rejects non-literal escapes such as digit or word classes.
tool.textescape.hint.properties=Follows java.util.Properties: escapes = : # ! and leading spaces; unescape handles line continuations. Enable Escape non-ASCII for ISO-8859-1 compatible files.
